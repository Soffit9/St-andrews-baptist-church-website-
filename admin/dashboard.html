<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard | St. Andrews Baptist Church</title><link rel="stylesheet" href="../assets/style.css"></head>
<body class="admin-page"><div class="admin-layout">
<aside class="sidebar">
  <h2>St. Andrews<br>Admin</h2>
  <nav>
    <a class="active" href="#">▣ Dashboard</a>
    <a href="../index.html">↩ View Website</a>
    <a href="#" id="logout">⎋ Log Out</a>
  </nav>
</aside>
<main class="admin-main">
  <div class="admin-top"><div><p class="eyebrow">ADMIN</p><h1 id="welcome-heading">Welcome, Pastor</h1></div><button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">🌙</button></div>
  <p id="updated-toast" class="toast"></p>
  <p class="notice">Click a page below to edit its text and photos. Changes only go live once you click <strong>Apply Changes</strong> and confirm — nothing updates by accident.</p>
  <div class="quick-grid">
    <button data-min-access="Can Edit" data-goto-page="global"><b>🏷</b><strong>Site Logo</strong><span>Update the logo shown on every page</span></button>
    <button data-min-access="Can Edit" data-goto-page="home"><b>⌂</b><strong>Homepage</strong><span>Edit welcome text and service time</span></button>
    <button data-min-access="Can Edit" onclick="window.location.href='hero-photos.html'"><b>🌄</b><strong>Homepage Photos</strong><span>Add rotating background photos</span></button>
    <button onclick="window.location.href='gallery.html'"><b>📷</b><strong>Gallery</strong><span>Add photos people can grab & download</span></button>
    <button data-min-access="Can Edit" data-goto-page="about"><b>👤</b><strong>About / Pastor</strong><span>Update the pastor note, history, and photo</span></button>
    <button data-min-access="Can Edit" data-goto-page="sermons"><b>▶</b><strong>Sermons</strong><span>Update the latest sermon's title, speaker, and passage</span></button>
    <button data-min-access="Can Edit" onclick="window.location.href='sermon-archive.html'"><b>🗄</b><strong>Sermon Archive</strong><span>Add past sermons, grouped by year</span></button>
    <button data-min-access="Can Edit" onclick="window.location.href='videos.html'"><b>🎬</b><strong>Videos</strong><span>Stash video links until they're ready to use</span></button>
    <button data-min-access="Can Edit" onclick="window.location.href='events.html'"><b>📅</b><strong>Events</strong><span>Click a day on the calendar to add or edit events</span></button>
    <button data-min-access="Can Edit" onclick="window.location.href='newsletter.html'"><b>📰</b><strong>Newsletter</strong><span>Write and publish church newsletters</span></button>
    <button data-min-access="Can Edit" data-goto-page="prayer"><b>🙏</b><strong>Prayer Page</strong><span>Update the intro text</span></button>
    <button data-min-access="Full Admin" onclick="window.location.href='prayer-requests.html'"><b>📨</b><strong>Prayer Requests</strong><span>Read what people have submitted</span></button>
    <button data-min-access="Can Edit" data-goto-page="contact"><b>☎</b><strong>Contact Info</strong><span>Update address, phone, email</span></button>
    <button data-min-access="Can Edit" data-goto-page="giving"><b>$</b><strong>Giving Info</strong><span>Update e-transfer and tax receipt notes</span></button>
    <button onclick="window.location.href='calendar.html'"><b>🗓</b><strong>Church Calendar</strong><span>Click any day to fill in who's doing what</span></button>
    <button data-min-access="Can Edit" onclick="window.location.href='whoswho.html'"><b>📇</b><strong>Who's Who</strong><span>Add or edit church members and their roles</span></button>
    <button data-min-access="Full Admin" onclick="window.location.href='admins.html'"><b>🔑</b><strong>Admin Users</strong><span>Manage who's on the admin team</span></button>
    <button data-min-access="Can Edit" onclick="window.location.href='log.html'"><b>📜</b><strong>Change Log</strong><span>See every change made, and download a copy</span></button>
    <button onclick="window.location.href='settings.html'"><b>⚙</b><strong>Settings</strong><span>Change password, set up the authenticator app</span></button>
  </div>
</main>
</div>
<script src="../assets/content.js"></script>
<script src="../assets/admin.js"></script>
</body></html>
