const CMS_KEY = "sabc_content";

function cmsLoadAll() {
  return window.__serverStore[CMS_KEY] || {};
}

/* Fire-and-forget save to the server for any of the shared-storage keys.
   The in-memory cache is already updated by the caller before this runs,
   so the page feels instant even though the network call happens after. */
function serverStoreSave(key, value) {
  return fetch(`/api/store/${key}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    credentials: "same-origin",
    body: JSON.stringify(value)
  }).catch(err => console.error("Save to server failed for", key, err));
}

async function cmsSavePage(pageKey, data) {
  const all = cmsLoadAll();
  const before = all[pageKey] || {};
  const changes = [];
  Object.keys(data).forEach(k => {
    if (before[k] !== data[k]) {
      const rawOld = before[k] ?? null, rawNew = data[k] ?? null;
      const isImage = (typeof rawOld === "string" && rawOld.startsWith("data:image")) || (typeof rawNew === "string" && rawNew.startsWith("data:image"));
      const change = { field: k, old: cmsTrim(rawOld), new: cmsTrim(rawNew), revertable: !isImage };
      if (!isImage) { change.rawOld = rawOld; change.rawNew = rawNew; } // needed to actually revert; skipped for photos to keep the log small
      changes.push(change);
    }
  });
  all[pageKey] = { ...before, ...data };
  window.__serverStore[CMS_KEY] = all;
  await serverStoreSave(CMS_KEY, all); // MUST finish before the caller is allowed to navigate away —
  // otherwise the browser cancels this request mid-flight the instant the page changes, and the
  // "save" silently never actually reaches the server. This was the "logo/sermons page doesn't save" bug.
  cmsLogChange(pageKey, changes);
  return { ok: true };
}

/* Reverts every revertable field in a log entry back to its recorded
   "old" value. Photos can't be auto-reverted (their old data isn't kept
   in the log, to avoid bloating storage) — those need a manual re-upload. */
async function cmsRevertLogEntry(entry) {
  const revertData = {};
  let any = false;
  (entry.changes || []).forEach(c => {
    if (c.revertable) { revertData[c.field] = c.rawOld; any = true; }
  });
  if (!any) return { ok: false, reason: "nothing revertable" };
  return await cmsSavePage(entry.page, revertData);
}

/* Same idea as above, but for the non-schema features (Calendar, Who's
   Who, Admin Users) that save a whole list/object straight to localStorage
   instead of going through cmsSavePage. Photo fields are stripped out
   before being kept in the log, same reasoning as above. */
function cmsStripImages(value) {
  if (typeof value === "string") return value.startsWith("data:image") ? "(photo — omitted from log to save space)" : value;
  if (Array.isArray(value)) return value.map(cmsStripImages);
  if (value && typeof value === "object") {
    const out = {};
    Object.keys(value).forEach(k => { out[k] = cmsStripImages(value[k]); });
    return out;
  }
  return value;
}
function cmsLogRawChange(label, revertKey, revertPath, before, after) {
  cmsLogChange(label, [{
    field: label, old: "(previous version)", new: "(updated)", revertable: true, isRaw: true,
    revertKey, revertPath, rawOld: cmsStripImages(before), rawNew: cmsStripImages(after)
  }]);
}
async function cmsRevertRawEntry(entry) {
  const c = (entry.changes || [])[0];
  if (!c || !c.revertable || !c.isRaw) return { ok: false };
  if (c.revertPath) {
    const data = window.__serverStore[c.revertKey] || {};
    data[c.revertPath] = c.rawOld;
    window.__serverStore[c.revertKey] = data;
    await serverStoreSave(c.revertKey, data);
  } else {
    window.__serverStore[c.revertKey] = c.rawOld;
    await serverStoreSave(c.revertKey, c.rawOld);
  }
  return { ok: true };
}

/* Shrinks a photo before it's stored, so a phone photo (often several MB)
   doesn't blow past the browser's ~5-10MB localStorage limit. Without this,
   uploading a couple of full-size photos can silently fail to save. */
function compressImage(file, maxDimension = 1000, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Could not read that image."));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDimension || height > maxDimension) {
          if (width > height) { height = Math.round(height * (maxDimension / width)); width = maxDimension; }
          else { width = Math.round(width * (maxDimension / height)); height = maxDimension; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* Safe wrapper for any other feature (calendar, Who's Who, admins) that
   writes straight to localStorage, so a storage failure shows up instead
   of silently doing nothing. */
function safeSetItem(key, value) {
  try {
    localStorage.setItem(key, value);
    return true;
  } catch (err) {
    console.error("Storage write failed for", key, err);
    alert("This didn't save — the browser's local storage is full (usually from too many/too-large photos). Try removing a photo or two, or use smaller photos, then try again.");
    return false;
  }
}

function cmsGetPage(pageKey) {
  const all = cmsLoadAll();
  const schema = CMS_SCHEMA[pageKey];
  const saved = all[pageKey] || {};
  const result = {};
  if (schema) {
    schema.fields.forEach(f => { result[f.id] = saved[f.id] ?? f.default; });
    schema.images.forEach(img => {
      result[img.id] = saved[img.id] || null;
      result[img.id + "_h"] = saved[img.id + "_h"] || 300;
      result[img.id + "_pos"] = saved[img.id + "_pos"] ?? 50;
    });
  }
  return result;
}

/* ---------------- Audit log ---------------- */
const CMS_LOG_KEY = "sabc_audit_log";

function cmsLogChange(page, changes) {
  if (!changes || !changes.length) return;
  const log = window.__serverStore[CMS_LOG_KEY] || [];
  log.unshift({ ts: new Date().toISOString(), page, changes });
  if (log.length > 500) log.length = 500;
  window.__serverStore[CMS_LOG_KEY] = log;
  serverStoreSave(CMS_LOG_KEY, log);
}

function cmsTrim(v) {
  if (v === null || v === undefined || v === "") return "(empty)";
  const s = String(v);
  if (s.startsWith("data:image")) return "(new photo uploaded)";
  return s.length > 70 ? s.slice(0, 70) + "…" : s;
}

/* Applies saved content to a public page. Call on DOMContentLoaded with
   the page key ("home", "about", etc). Looks for elements marked
   data-field="fieldId" (text) and data-image="imageId" (image slot). */
function cmsApplyToPage(pageKey) {
  const global = cmsGetPage("global");
  if (global.logo) {
    const logoH = global.logo_h || 44;
    document.querySelectorAll("[data-image='logo']").forEach(el => {
      el.style.height = logoH + "px";
      el.style.width = "auto";
      el.style.border = "none";
      el.style.background = "none";
      el.innerHTML = `<img src="${global.logo}" alt="Church logo" style="height:100%;width:auto;display:block;object-fit:contain">`;
    });
  }

  if (!pageKey || !CMS_SCHEMA[pageKey]) return;
  const content = cmsGetPage(pageKey);

  document.querySelectorAll("[data-field]").forEach(el => {
    const id = el.getAttribute("data-field");
    if (content[id] !== undefined && content[id] !== null) {
      el.textContent = content[id];
    }
  });

  document.querySelectorAll("[data-image]").forEach(el => {
    const id = el.getAttribute("data-image");
    if (id === "logo") return; // handled above, global
    if (content[id]) {
      const h = content[id + "_h"] || 300;
      const pos = content[id + "_pos"] ?? 50;
      el.style.height = h + "px";
      el.style.overflow = "hidden";
      el.innerHTML = `<img src="${content[id]}" alt="" style="width:100%;height:100%;object-fit:cover;object-position:50% ${pos}%;border-radius:inherit">`;
    }
  });

  // Sermons: swap in a YouTube embed if a video has been set
  if (pageKey === "sermons" && content.youtube_id) {
    const slot = document.querySelector("#sermon-video");
    if (slot) {
      const match = String(content.youtube_id).match(/(?:v=|youtu\.be\/|embed\/)?([a-zA-Z0-9_-]{11})(?:[?&]|$)/);
      const vid = match ? match[1] : content.youtube_id;
      slot.innerHTML = `<iframe width="100%" height="100%" style="position:absolute;inset:0;border:0" src="https://www.youtube.com/embed/${vid}" title="Latest sermon" allowfullscreen></iframe>`;
      slot.style.position = "relative";
      slot.style.paddingBottom = "56.25%";
      slot.style.height = "0";
    }
  }

  // Homepage "Latest Sermon" box always mirrors the real Sermons page content,
  // so there's one single place (Admin → Sermons) to edit it, not two.
  const homeVideoSlot = document.querySelector("#home-sermon-video");
  if (homeVideoSlot) {
    const sermonContent = cmsGetPage("sermons");
    const titleEl = document.querySelector("#home-sermon-title");
    if (titleEl && sermonContent.latest_title) titleEl.textContent = sermonContent.latest_title;
    if (sermonContent.youtube_id) {
      const match = String(sermonContent.youtube_id).match(/(?:v=|youtu\.be\/|embed\/)?([a-zA-Z0-9_-]{11})(?:[?&]|$)/);
      const vid = match ? match[1] : sermonContent.youtube_id;
      homeVideoSlot.innerHTML = `<iframe width="100%" height="100%" style="position:absolute;inset:0;border:0" src="https://www.youtube.com/embed/${vid}" title="Latest sermon" allowfullscreen></iframe>`;
      homeVideoSlot.style.position = "relative";
      homeVideoSlot.style.paddingBottom = "56.25%";
      homeVideoSlot.style.height = "0";
      const fallback = document.querySelector("#home-sermon-fallback-text");
      if (fallback) fallback.style.display = "none";
    }
  }
}

</script>
<script>
/* ---------------------------------------------------------------------
   Admin-only behaviour: login flow (prototype 2-step), the "which page
   do you want to edit" picker, and the edit form itself.
--------------------------------------------------------------------- */

// Password checking now happens server-side (backend/app.py) — nothing
// resembling a password lives in this file anymore, on purpose. That was
// the entire point of building the real backend: a visitor viewing this
// page's source can no longer just read the password.

function requireLogin() {
  if (!window.__adminSession || !window.__adminSession.loggedIn) {
    window.location.href = "login.html";
  }
}

/* Shows a small "logged in as X (access level)" indicator on every admin
   page, so if something seems locked/won't save, it's obvious at a glance
   whether you're on a View Only account instead of a mystery bug. */
function showWhoAmI() {
  if (document.querySelector("#login-step-1")) return; // not logged in yet on this page
  const me = cmsGetCurrentAdmin();
  if (!me) return;
  const topbar = document.querySelector(".admin-topbar") || document.querySelector(".admin-top");
  if (!topbar) return;
  const tag = document.createElement("span");
  tag.style.cssText = "font-size:12px;color:var(--muted);margin-left:auto;margin-right:12px;align-self:center";
  tag.textContent = `Logged in as ${me.name || me.email} (${me.access || "Full Admin"})`;
  topbar.appendChild(tag);
}
document.addEventListener("sabc:session-ready", showWhoAmI);

/* Small mockups of each page's editable region, used as the live preview
   pane in edit.html. Kept intentionally simple (not the full page chrome)
   so it's fast and can't drift out of sync with the real header/nav. */
function previewTemplate(pageKey, c) {
  const imgBox = (id, label) => c[id]
    ? `<div data-preview-image="${id}" style="height:${c[id+'_h']||300}px;border-radius:10px;overflow:hidden"><img src="${c[id]}" style="width:100%;height:100%;object-fit:cover;object-position:50% ${c[id+'_pos']??50}%"></div>`
    : `<div class="image-placeholder" data-preview-image="${id}" style="height:${c[id+'_h']||300}px;border-radius:10px">${label}</div>`;

  switch (pageKey) {
    case "global":
      return `<div style="display:flex;align-items:center;gap:10px">
        <div class="logo-placeholder" data-preview-image="logo" style="${c.logo ? `height:${c.logo_h||44}px;width:auto` : ""}">${c.logo ? `<img src="${c.logo}" style="height:100%;width:auto;display:block;object-fit:contain">` : "LOGO"}</div>
        <strong>St. Andrews Baptist Church</strong></div>
        <p class="field-hint" style="margin-top:14px">The logo appears at this height in the header — width follows the photo's real shape, so nothing gets squished.</p>`;
    case "home":
      return `<p class="eyebrow">ST. ANDREWS BAPTIST CHURCH</p>
        <h1 data-preview="hero_heading">${c.hero_heading}</h1>
        <p class="lead" data-preview="hero_sub">${c.hero_sub}</p>
        <div class="service-card"><strong>Sunday Worship</strong><span data-preview="service_time">${c.service_time}</span></div>`;
    case "about":
      return `${imgBox("church_photo", "CHURCH PHOTO")}
        <h2 style="margin-top:16px">Meet Our Pastor</h2>
        <p data-preview="pastor_note">${c.pastor_note}</p>
        <h2>Our History</h2>
        <p data-preview="history_note">${c.history_note}</p>
        <p data-preview="history_note_more" style="white-space:pre-line">${c.history_note_more}</p>
        <h2>Partner Ministries</h2>
        <p><b>Canadian Baptists of Atlantic Canada</b><br><span data-preview="partner1_desc">${c.partner1_desc}</span></p>
        <p><b>Canadian Baptist Ministries</b><br><span data-preview="partner2_desc">${c.partner2_desc}</span></p>
        <p><b>Crandall University</b><br><span data-preview="partner3_desc">${c.partner3_desc}</span></p>
        <p><b>Acadia Divinity College</b><br><span data-preview="partner4_desc">${c.partner4_desc}</span></p>
        <h2>What We Believe</h2>
        <p data-preview="what_we_believe">${c.what_we_believe}</p>
        <h2>Leadership</h2><p data-preview="leadership_note">${c.leadership_note}</p>
        <h2>Open Communion</h2><p data-preview="communion_note">${c.communion_note}</p>
        <h2>Sunday School</h2><p data-preview="sunday_school_note">${c.sunday_school_note}</p>`;
    case "sermons":
      return `<div class="video-placeholder featured" style="min-height:160px">▶</div>
        <div class="sermon-meta" style="margin-top:10px">
          <h2 data-preview="latest_title">${c.latest_title}</h2>
          <p><span data-preview="latest_speaker">${c.latest_speaker}</span> · <span data-preview="latest_passage">${c.latest_passage}</span></p>
        </div>
        <p class="field-hint">${c.youtube_id ? "A YouTube video is set — it'll replace the ▶ box above on the real page." : "No YouTube video set yet."}</p>`;
    case "events":
      return `<h1>Upcoming Events</h1><p data-preview="events_note">${c.events_note}</p>`;
    case "prayer":
      return `<h1>Prayer Request</h1><p data-preview="prayer_intro">${c.prayer_intro}</p>`;
    case "contact":
      return `<h2>Contact Us</h2>
        <p>📍 <span data-preview="address">${c.address}</span></p>
        <p>☎ <span data-preview="phone">${c.phone}</span></p>
        <p>✉ <span data-preview="email">${c.email}</span></p>`;
    case "giving":
      return `<h2>E-Transfer</h2><p data-preview="etransfer_note">${c.etransfer_note}</p>
        <h2 style="margin-top:16px">Tax Receipts</h2><p data-preview="tax_note">${c.tax_note}</p>`;
    default:
      return "<p>No preview available.</p>";
  }
}

document.addEventListener("sabc:session-ready", () => {

  if (window.location.protocol === "file:") {
    const banner = document.createElement("div");
    banner.className = "file-warning";
    banner.innerHTML = "⚠ You're opening this page directly as a file. Some browsers won't reliably save admin changes this way (photos, calendar entries, the log) — see README.md, \"Running this properly,\" for the easiest fix.";
    document.body.prepend(banner);
  }

  if (typeof cmsApplyToPage === "function") cmsApplyToPage(null); // just applies the global logo, if set

  /* ---------- Login page (2-step prototype) ---------- */
  const step1 = document.querySelector("#login-step-1");
  const stepMethod = document.querySelector("#login-step-method");
  const stepEmail = document.querySelector("#login-step-email");
  const step2 = document.querySelector("#login-step-2");
  if (step1 && stepMethod && stepEmail && step2) {
    let currentPassword = "";
    let chosenMethod = "email"; // "email" or "totp" — just changes the messaging, both call the same endpoints

    function showOnly(el) {
      [step1, stepMethod, stepEmail, step2].forEach(s => s.classList.add("hidden-step"));
      el.classList.remove("hidden-step");
    }

    // Restore progress if the phone reloaded this tab while you were off
    // checking your email — skips straight to "enter your code" instead of
    // making you type your password again. Expires after 9 minutes to stay
    // just under the server's 10-minute code lifetime.
    (function restoreProgress() {
      try {
        const saved = JSON.parse(sessionStorage.getItem("sabc_login_progress") || "null");
        if (!saved || Date.now() - saved.ts > 9 * 60 * 1000) { sessionStorage.removeItem("sabc_login_progress"); return; }
        chosenMethod = saved.chosenMethod;
        document.querySelector("#who-email").value = saved.email;
        const codeBox = document.querySelector("#code-box");
        const resendWrap = document.querySelector("#resend-wrap");
        codeBox.innerHTML = chosenMethod === "totp"
          ? "Enter the current code from your authenticator app."
          : `A code was sent to <b>${saved.email}</b> a moment ago — enter it below, or request a new one if it's expired.`;
        resendWrap.style.display = chosenMethod === "totp" ? "none" : "";
        showOnly(step2);
        document.querySelector("#code-input").focus();
      } catch { sessionStorage.removeItem("sabc_login_progress"); }
    })();

    step1.addEventListener("submit", e => {
      e.preventDefault();
      currentPassword = document.querySelector("#password").value;
      document.querySelector("#password-message").textContent = "";
      showOnly(stepMethod);
    });

    document.querySelector("#back-to-password").addEventListener("click", () => { sessionStorage.removeItem("sabc_login_progress"); showOnly(step1); });

    document.querySelector("#method-email").addEventListener("click", () => {
      chosenMethod = "email";
      showOnly(stepEmail);
      document.querySelector("#who-email").focus();
    });
    document.querySelector("#method-totp").addEventListener("click", () => {
      chosenMethod = "totp";
      showOnly(stepEmail);
      document.querySelector("#who-email").focus();
    });

    let requestInFlight = false;
    async function requestCode() {
      if (requestInFlight) return false; // already sending one — ignore a second trigger instead of sending two
      requestInFlight = true;
      const email = document.querySelector("#who-email").value.trim();
      const emailMsg = document.querySelector("#email-message");
      emailMsg.textContent = "";
      const stepEmailBtn = stepEmail.querySelector("button[type=submit]");
      const resendBtn = document.querySelector("#resend-code");
      if (stepEmailBtn) stepEmailBtn.disabled = true;
      if (resendBtn) resendBtn.disabled = true;
      try {
        const res = await fetch("/api/auth/password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ password: currentPassword, email, method: chosenMethod })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          emailMsg.className = "error";
          emailMsg.textContent = data.error || "Something went wrong — check your password and try again.";
          if ((data.error || "").toLowerCase().includes("password")) showOnly(step1);
          return false;
        }
        const codeBox = document.querySelector("#code-box");
        const resendWrap = document.querySelector("#resend-wrap");
        if (chosenMethod === "totp") {
          codeBox.innerHTML = "Enter the current code from your authenticator app.";
          resendWrap.style.display = "none";
        } else if (data.emailed) {
          codeBox.innerHTML = `A code was just emailed to <b>${email}</b>. (Requesting a new one invalidates this one — only the newest code works.)`;
          resendWrap.style.display = "";
        } else {
          codeBox.innerHTML = `Email isn't set up yet, so here's the code directly: <strong>${data.demo_code}</strong>`;
          resendWrap.style.display = "";
        }
        // Remember where we are — if the phone's browser reloads this tab
        // while you're off checking email (very common on mobile), coming
        // back should land on "enter your code," not force you to start
        // over. The code itself stays valid server-side either way.
        sessionStorage.setItem("sabc_login_progress", JSON.stringify({ email, chosenMethod, ts: Date.now() }));
        return true;
      } catch {
        emailMsg.className = "error";
        emailMsg.textContent = "Couldn't reach the server — is the backend running?";
        return false;
      } finally {
        requestInFlight = false;
        if (stepEmailBtn) stepEmailBtn.disabled = false;
        if (resendBtn) resendBtn.disabled = false;
      }
    }

    stepEmail.addEventListener("submit", async e => {
      e.preventDefault();
      if (await requestCode()) {
        showOnly(step2);
        document.querySelector("#code-input").focus();
      }
    });

    const resend = document.querySelector("#resend-code");
    if (resend) resend.addEventListener("click", requestCode);

    step2.addEventListener("submit", async e => {
      e.preventDefault();
      const entered = document.querySelector("#code-input").value.trim();
      const email = document.querySelector("#who-email").value.trim();
      const msg = document.querySelector("#login-message");
      try {
        const res = await fetch("/api/auth/verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ email, code: entered })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          msg.className = "error";
          msg.textContent = data.error || "That code doesn't match. Double check and try again.";
          return;
        }
        sessionStorage.removeItem("sabc_login_progress");
        window.__adminSession = { loggedIn: true, name: data.name, email: data.email, access: data.access };
        const returnTo = localStorage.getItem("sabc_return_to");
        if (returnTo) { localStorage.removeItem("sabc_return_to"); window.location.href = returnTo; }
        else window.location.href = "dashboard.html";
      } catch (err) {
        msg.className = "error";
        msg.textContent = "Couldn't reach the server — is the backend running?";
      }
    });
  }

  /* ---------- Dashboard page picker ---------- */
  const pageButtons = document.querySelectorAll("[data-goto-page]");
  if (pageButtons.length) {
    requireLogin();
    const welcomeEl = document.querySelector("#welcome-heading");
    if (welcomeEl) {
      const me = cmsGetCurrentAdmin();
      welcomeEl.textContent = (() => {
        const rawName = me ? (me.name || me.email || "Admin") : "Admin";
        const firstWord = rawName.trim().split(/\s+/)[0];
        const firstName = firstWord.charAt(0).toUpperCase() + firstWord.slice(1);
        const hour = new Date().getHours();
        const greeting = hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening";
        return `${greeting}, ${firstName}`;
      })();
    }
    pageButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        window.location.href = "edit.html?page=" + btn.getAttribute("data-goto-page");
      });
    });

    // Hide dashboard tiles the current admin shouldn't have access to.
    // Full Admin sees everything. Can Edit sees everything except Admin
    // Users and Prayer Requests (so an editor can't grant themselves
    // Full Admin). View Only sees only Church Calendar and Gallery
    // (those two tiles are simply left with no data-min-access at all).
    const RANK = { "View Only": 0, "Can Edit": 1, "Full Admin": 2 };
    const myRank = RANK[(me && me.access) || "Full Admin"] ?? 2;
    document.querySelectorAll(".quick-grid button[data-min-access]").forEach(btn => {
      const required = RANK[btn.dataset.minAccess] ?? 0;
      if (myRank < required) btn.style.display = "none";
    });
  }
  const logoutBtn = document.querySelector("#logout");
  if (logoutBtn) logoutBtn.addEventListener("click", async () => {
    try { await fetch("/api/auth/logout", { method: "POST", credentials: "same-origin" }); } catch {}
    window.location.href = "login.html";
  });

  /* ---------- Edit page ---------- */
  const editRoot = document.querySelector("#edit-root");
  if (editRoot) {
    requireLogin();
    const params = new URLSearchParams(window.location.search);
    const pageKey = params.get("page");
    const schema = CMS_SCHEMA[pageKey];
    const titleEl = document.querySelector("#edit-title");

    if (!schema) {
      editRoot.innerHTML = "<p>Unknown page. <a href='dashboard.html'>Go back</a>.</p>";
    } else {
      if (titleEl) titleEl.textContent = "Edit: " + schema.label;
      const current = cmsGetPage(pageKey);

      let formHtml = "<form id='edit-form'>";

      schema.images.forEach(img => {
        const preview = current[img.id]
          ? `<img src="${current[img.id]}" alt="">`
          : `<span>Click to add photo</span>`;
        formHtml += `
          <div class="edit-field">
            <label>${img.label}</label>
            <p class="field-hint">${img.hint || ""}</p>
            <label class="image-upload-slot" for="img_${img.id}">${preview}</label>
            <input type="file" accept="image/*" id="img_${img.id}" data-image-id="${img.id}" style="display:none">
            ${current[img.id] ? `<button type="button" class="text-btn" data-clear-image="${img.id}" data-allow-view-only style="font-size:13px;margin-top:6px">Remove this photo</button>` : ""}`;
        if (img.sizable) {
          const minH = img.sizeMin ?? 150, maxH = img.sizeMax ?? 500, defH = current[img.id + "_h"] || img.sizeDefault || 300;
          formHtml += `
            <div class="size-field">
              <label for="size_${img.id}">Photo height <span class="size-readout" id="size_readout_${img.id}">${defH}px</span></label>
              <input type="range" min="${minH}" max="${maxH}" step="2" id="size_${img.id}" data-size-id="${img.id}" value="${defH}">
            </div>`;
          if (img.positionable !== false) {
            formHtml += `
            <div class="size-field">
              <label for="pos_${img.id}">Focus point <span class="size-readout" id="pos_readout_${img.id}">${current[img.id + "_pos"] < 34 ? "top" : current[img.id + "_pos"] > 66 ? "bottom" : "center"}</span></label>
              <p class="field-hint">Drag left to show more of the top of the photo, right to show more of the bottom.</p>
              <input type="range" min="0" max="100" step="1" id="pos_${img.id}" data-pos-id="${img.id}" value="${current[img.id + "_pos"]}">
            </div>`;
          }
        }
        formHtml += `</div>`;
      });

      schema.fields.forEach(f => {
        const val = (current[f.id] || "").toString();
        formHtml += `<div class="edit-field"><label for="f_${f.id}">${f.label}</label>`;
        formHtml += f.type === "textarea"
          ? `<textarea id="f_${f.id}" data-field-id="${f.id}" rows="4">${val}</textarea>`
          : `<input id="f_${f.id}" data-field-id="${f.id}" type="text" value="${val.replace(/"/g, "&quot;")}">`;
        formHtml += `</div>`;
      });

      formHtml += `
        <div class="edit-actions">
          <a class="button button-light" href="dashboard.html">← Back without saving</a>
          <button type="submit" class="button" data-allow-view-only>Apply Changes</button>
        </div>
      </form>`;

      editRoot.innerHTML = `
        <div class="edit-split">
          <div class="edit-col" id="edit-col"><h3>Edit</h3>${formHtml}</div>
          <div class="preview-col"><h3>Live Preview</h3><div class="preview-frame" id="preview-frame">${previewTemplate(pageKey, current)}</div></div>
        </div>`;
      cmsApplyViewOnlyLock(document.querySelector("#edit-col"));

      function refreshPreview(id, value) {
        document.querySelectorAll(`#preview-frame [data-preview="${id}"]`).forEach(el => el.textContent = value);
      }
      function refreshPreviewImage(id, dataUrl, height, pos) {
        document.querySelectorAll(`#preview-frame [data-preview-image="${id}"]`).forEach(el => {
          if (id === "logo") {
            el.style.height = height + "px";
            el.style.width = "auto";
            el.innerHTML = `<img src="${dataUrl}" alt="" style="height:100%;width:auto;display:block;object-fit:contain">`;
          } else {
            el.style.height = (height || 300) + "px";
            el.innerHTML = `<img src="${dataUrl}" alt="" style="width:100%;height:100%;object-fit:cover;object-position:50% ${pos ?? 50}%">`;
          }
        });
      }
      function currentPos(id) {
        const range = editRoot.querySelector(`[data-pos-id="${id}"]`);
        return range ? range.value : (current[id + "_pos"] ?? 50);
      }
      function currentSize(id) {
        const range = editRoot.querySelector(`[data-size-id="${id}"]`);
        return range ? range.value : (current[id + "_h"] || 300);
      }

      // Live text updates as you type
      editRoot.querySelectorAll("[data-field-id]").forEach(input => {
        input.addEventListener("input", () => refreshPreview(input.dataset.fieldId, input.value));
      });

      // Live size updates
      editRoot.querySelectorAll("[data-size-id]").forEach(range => {
        range.addEventListener("input", () => {
          const id = range.dataset.sizeId;
          document.querySelector(`#size_readout_${id}`).textContent = range.value + "px";
          const imgInput = editRoot.querySelector(`[data-image-id="${id}"]`);
          const src = imgInput.dataset.value || current[id];
          if (src) refreshPreviewImage(id, src, range.value, currentPos(id));
        });
      });

      // Live focus-point updates
      editRoot.querySelectorAll("[data-pos-id]").forEach(range => {
        range.addEventListener("input", () => {
          const id = range.dataset.posId;
          const label = range.value < 34 ? "top" : range.value > 66 ? "bottom" : "center";
          document.querySelector(`#pos_readout_${id}`).textContent = label;
          const imgInput = editRoot.querySelector(`[data-image-id="${id}"]`);
          const src = imgInput.dataset.value || current[id];
          if (src) refreshPreviewImage(id, src, currentSize(id), range.value);
        });
      });

      // Image previews + storage as a compressed photo (keeps localStorage small
      // enough that a couple of full-size phone photos won't silently fail to save)
      editRoot.querySelectorAll("input[type=file]").forEach(input => {
        input.addEventListener("change", () => {
          const file = input.files[0];
          if (!file) return;
          compressImage(file, 1000, 0.75).then(dataUrl => {
            const slot = input.previousElementSibling;
            slot.innerHTML = `<img src="${dataUrl}" alt="">`;
            input.dataset.value = dataUrl;
            delete input.dataset.cleared;
            refreshPreviewImage(input.dataset.imageId, dataUrl, currentSize(input.dataset.imageId), currentPos(input.dataset.imageId));
          }).catch(err => alert("Couldn't process that photo: " + err.message));
        });
      });

      editRoot.querySelectorAll("[data-clear-image]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.clearImage;
          const input = editRoot.querySelector(`[data-image-id="${id}"]`);
          input.dataset.cleared = "true";
          delete input.dataset.value;
          input.previousElementSibling.innerHTML = "<span>Click to add photo</span>";
          const frame = document.querySelector(`#preview-frame [data-preview-image="${id}"]`);
          if (frame) frame.innerHTML = id === "global" || id === "logo" ? "LOGO" : "";
          btn.remove();
        });
      });

      document.querySelector("#edit-form").addEventListener("submit", e => {
        e.preventDefault();
        document.querySelector("#confirm-modal").classList.add("open");
      });

      document.querySelector("#confirm-yes").addEventListener("click", async () => {
        const data = {};
        editRoot.querySelectorAll("[data-field-id]").forEach(el => { data[el.dataset.fieldId] = el.value; });
        editRoot.querySelectorAll("[data-image-id]").forEach(el => {
          if (el.dataset.cleared === "true") data[el.dataset.imageId] = null;
          else if (el.dataset.value) data[el.dataset.imageId] = el.dataset.value;
        });
        editRoot.querySelectorAll("[data-size-id]").forEach(el => { data[el.dataset.sizeId + "_h"] = el.value; });
        editRoot.querySelectorAll("[data-pos-id]").forEach(el => { data[el.dataset.posId + "_pos"] = el.value; });
        const confirmYesBtn = document.querySelector("#confirm-yes");
        confirmYesBtn.disabled = true;
        confirmYesBtn.textContent = "Saving…";
        const result = await cmsSavePage(pageKey, data);
        document.querySelector("#confirm-modal").classList.remove("open");
        confirmYesBtn.disabled = false;
        confirmYesBtn.textContent = "Yes, Apply Changes";
        if (!result.ok) {
          alert("This didn't save — the browser's storage is full (usually from too many/too-large photos). Try a smaller photo, or remove an existing one first, then try again.");
          return;
        }
        window.location.href = "dashboard.html?updated=" + encodeURIComponent(schema.label);
      });
      document.querySelector("#confirm-no").addEventListener("click", () => {
        document.querySelector("#confirm-modal").classList.remove("open");
      });
    }
  }

  /* ---------- "Updated!" toast on the dashboard ---------- */
  const params = new URLSearchParams(window.location.search);
  const updated = params.get("updated");
  if (updated) {
    const toast = document.querySelector("#updated-toast");
    if (toast) {
      toast.textContent = "✓ " + updated + " updated — the live pages now reflect your change.";
      toast.classList.add("show");
    }
  }
});

</script>
<script>
/* ---------------------------------------------------------------------
   Extra admin tools — all backed by real shared server storage now
   (window.__serverStore, populated in content.js before any of this
   runs). loadJSON/saveJSON below keep their old localStorage-style
   signatures on purpose, so nothing else in this file needed rewriting:
   - Sunday roles calendar   (sabc_schedule, sabc_roster)
   - Who's Who directory      (sabc_whoswho)
   - Admin user list          (sabc_admin_users, its own dedicated /api/admins)
   - Change log                (sabc_audit_log, via content.js)
--------------------------------------------------------------------- */

const DEFAULT_SCHEDULE_ROLES = ["Opening Prayer", "Worship / Singing", "Offering", "Sound", "Slides / Projection", "Greeting / Doors"];
function getScheduleRoles() { return loadJSON("sabc_schedule_roles", DEFAULT_SCHEDULE_ROLES); }

function loadJSON(key, fallback) {
  const v = window.__serverStore ? window.__serverStore[key] : undefined;
  if (v && typeof v === "object" && !Array.isArray(v) && "error" in v) return fallback; // access denied for this key — treat as empty rather than crash a page
  return v ?? fallback;
}
function saveJSON(key, value) {
  if (!window.__serverStore) return Promise.resolve(false);
  window.__serverStore[key] = value;
  return serverStoreSave(key, value).then(() => true);
}
// Local calendar date (not UTC) — matches the fix in app.js. Using
// toISOString() here was quietly excluding "today's" events from the
// upcoming list in the evening, since UTC had already rolled to tomorrow.
function isoDate(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function uid() { return Math.random().toString(36).slice(2, 9); }

document.addEventListener("sabc:session-ready", () => {
  if (document.querySelector("#cal-grid")) initCalendar();
  if (document.querySelector("#events-cal-grid")) initEventsAdmin();
  if (document.querySelector("#home-events")) renderUpcomingEvents("#home-events", 3);
  if (document.querySelector("#events-list-root")) renderUpcomingEvents("#events-list-root");
  if (document.querySelector("#whoswho-admin-root")) initWhoswhoAdmin();
  if (document.querySelector("#whoswho-public-root")) initWhoswhoPublic();
  if (document.querySelector("#admins-root")) initAdmins();
  if (document.querySelector("#log-root")) initLog();
  if (document.querySelector("#sermon-archive-admin-root")) initSermonArchiveAdmin();
  if (document.querySelector("#sermon-archive-root")) renderSermonArchivePublic();
  if (document.querySelector("#hero-bg-a")) initHeroRotation();
  if (document.querySelector("#hero-photos-admin-root")) initHeroPhotosAdmin();
  if (document.querySelector("#gallery-admin-root")) initGalleryAdmin();
  if (document.querySelector("#gallery-public-root")) renderGalleryPublic();
  if (document.querySelector("#prayer-requests-admin-root")) initPrayerRequestsAdmin();
  if (document.querySelector("#settings-admin-root")) initSettingsAdmin();
});

/* ============================= CALENDAR ============================= */
function initCalendar() {
  requireLogin();
  const monthLabel = document.querySelector("#cal-month-label");
  const grid = document.querySelector("#cal-grid");
  const roster = document.querySelector("#roster-bar");
  const rolesBar = document.querySelector("#roles-bar");
  const panel = document.querySelector("#role-panel");
  let view = new Date(); view.setDate(1);
  let selected = null;

  function renderRolesBar() {
    if (!rolesBar) return;
    const roles = getScheduleRoles();
    rolesBar.innerHTML = roles.map(r =>
      `<span class="roster-chip">${r} <button data-remove-role="${r}" type="button">×</button></span>`
    ).join("") + `
      <input type="text" id="new-role-name" placeholder="Add a role (e.g. Nursery)" style="padding:6px 10px;border:1px solid #b9c5d3;border-radius:20px">
      <button class="button" id="add-role-name" type="button" style="padding:6px 14px">+ Add Role</button>`;
    rolesBar.querySelectorAll("[data-remove-role]").forEach(btn => btn.addEventListener("click", () => {
      const roles = getScheduleRoles().filter(r => r !== btn.dataset.removeRole);
      saveJSON("sabc_schedule_roles", roles);
      renderRolesBar();
      if (selected) renderPanel();
    }));
    rolesBar.querySelector("#add-role-name").addEventListener("click", () => {
      const input = rolesBar.querySelector("#new-role-name");
      const val = input.value.trim();
      if (!val) return;
      const roles = getScheduleRoles();
      if (!roles.includes(val)) { roles.push(val); saveJSON("sabc_schedule_roles", roles); }
      renderRolesBar();
      if (selected) renderPanel();
    });
    cmsApplyViewOnlyLock(rolesBar);
  }

  function renderRoster() {
    const names = loadJSON("sabc_roster", []);
    roster.innerHTML = names.map(n =>
      `<span class="roster-chip">${n} <button data-remove-name="${n}" type="button">×</button></span>`
    ).join("") + `
      <input type="text" id="new-roster-name" placeholder="Add a volunteer's name" style="padding:6px 10px;border:1px solid #b9c5d3;border-radius:20px">
      <button class="button" id="add-roster-name" type="button" style="padding:6px 14px">+ Add</button>`;
    roster.querySelectorAll("[data-remove-name]").forEach(btn => btn.addEventListener("click", () => {
      const names = loadJSON("sabc_roster", []).filter(n => n !== btn.dataset.removeName);
      saveJSON("sabc_roster", names);
      renderRoster(); renderNameOptions();
    }));
    document.querySelector("#add-roster-name").addEventListener("click", () => {
      const input = roster.querySelector("#new-roster-name");
      const val = input.value.trim();
      if (!val) return;
      const names = loadJSON("sabc_roster", []);
      if (!names.includes(val)) { names.push(val); saveJSON("sabc_roster", names); }
      renderRoster(); renderNameOptions();
    });
    cmsApplyViewOnlyLock(roster);
  }

  function renderNameOptions() {
    const dl = document.querySelector("#roster-datalist");
    if (!dl) return;
    dl.innerHTML = loadJSON("sabc_roster", []).map(n => `<option value="${n}">`).join("");
  }

  function renderGrid() {
    const schedule = loadJSON("sabc_schedule", {});
    monthLabel.textContent = view.toLocaleDateString(undefined, { month: "long", year: "numeric" });
    const firstDow = view.getDay();
    const daysIn = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
    let html = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map(d => `<div class="cal-dow">${d}</div>`).join("");
    for (let i = 0; i < firstDow; i++) html += `<div class="cal-day empty"></div>`;
    for (let day = 1; day <= daysIn; day++) {
      const d = new Date(view.getFullYear(), view.getMonth(), day);
      const iso = isoDate(d);
      const isSunday = d.getDay() === 0;
      const hasData = !!schedule[iso];
      html += `<div class="cal-day clickable${isSunday ? " sunday" : ""}${hasData ? " has-data" : ""}${selected === iso ? " selected" : ""}"
                    data-date="${iso}">${day}</div>`;
    }
    grid.innerHTML = html;
    grid.querySelectorAll("[data-date]").forEach(el => el.addEventListener("click", () => {
      selected = el.dataset.date;
      renderGrid();
      renderPanel();
    }));
  }

  function renderPanel() {
    if (!selected) { panel.innerHTML = "<p class='field-hint'>Click a day above to fill in who's doing what.</p>"; return; }
    const schedule = loadJSON("sabc_schedule", {});
    const entry = schedule[selected] || {};
    const activeRoles = Object.keys(entry); // only roles explicitly added to THIS day
    const catalog = getScheduleRoles();
    const availableToAdd = catalog.filter(r => !activeRoles.includes(r));
    const niceDate = new Date(selected + "T00:00:00").toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

    let html = `<h3>${niceDate}</h3>`;
    if (!activeRoles.length) {
      html += `<p class="field-hint">No roles added to this day yet. Pick one below to get started.</p>`;
    }
    activeRoles.forEach(role => {
      const cur = entry[role] || { name: "", status: "" };
      html += `
        <div class="role-row">
          <div>
            <label>${role}</label>
            <input type="text" list="roster-datalist" data-role="${role}" data-kind="name" value="${cur.name}" placeholder="Who's doing this?">
          </div>
          <select data-role="${role}" data-kind="status">
            <option value="" ${cur.status === "" ? "selected" : ""}>Unconfirmed</option>
            <option value="yes" ${cur.status === "yes" ? "selected" : ""}>Yes, confirmed</option>
            <option value="no" ${cur.status === "no" ? "selected" : ""}>No / can't make it</option>
          </select>
          <button type="button" data-remove-day-role="${role}" title="Remove this role from this day" style="background:none;border:0;color:#a62929;font-weight:800;cursor:pointer">✕</button>
        </div>`;
    });
    html += `<datalist id="roster-datalist"></datalist>`;
    if (availableToAdd.length) {
      html += `
        <div class="role-row" style="grid-template-columns:1fr auto">
          <select id="add-role-to-day"><option value="">+ Add a role to this day…</option>${availableToAdd.map(r => `<option value="${r}">${r}</option>`).join("")}</select>
          <button type="button" id="add-role-to-day-btn" class="button button-light">Add</button>
        </div>`;
    } else {
      html += `<p class="field-hint">Every role in your catalog is already added to this day. Add more role types above if you need another.</p>`;
    }
    html += `<div class="edit-actions"><span></span><button class="button" id="save-schedule" type="button">Apply Changes</button></div>`;
    panel.innerHTML = html;
    renderNameOptions();
    cmsApplyViewOnlyLock(panel);

    panel.querySelectorAll("[data-remove-day-role]").forEach(btn => btn.addEventListener("click", () => {
      const schedule = loadJSON("sabc_schedule", {});
      if (schedule[selected]) { delete schedule[selected][btn.dataset.removeDayRole]; saveJSON("sabc_schedule", schedule); }
      renderPanel();
      renderGrid();
    }));
    const addBtn = panel.querySelector("#add-role-to-day-btn");
    if (addBtn) addBtn.addEventListener("click", () => {
      const roleToAdd = panel.querySelector("#add-role-to-day").value;
      if (!roleToAdd) return;
      const schedule = loadJSON("sabc_schedule", {});
      if (!schedule[selected]) schedule[selected] = {};
      schedule[selected][roleToAdd] = { name: "", status: "" };
      saveJSON("sabc_schedule", schedule);
      renderPanel();
    });

    const saveBtn = document.querySelector("#save-schedule");
    if (saveBtn) saveBtn.addEventListener("click", () => {
      const newEntry = {};
      activeRoles.forEach(role => {
        const name = panel.querySelector(`[data-role="${role}"][data-kind="name"]`).value;
        const status = panel.querySelector(`[data-role="${role}"][data-kind="status"]`).value;
        newEntry[role] = { name, status };
      });
      const schedule = loadJSON("sabc_schedule", {});
      const before = schedule[selected] || {};
      schedule[selected] = newEntry;
      saveJSON("sabc_schedule", schedule);
      cmsLogRawChange("Church Calendar — " + niceDate, "sabc_schedule", selected, before, newEntry);
      renderGrid();
      const toast = document.querySelector("#cal-toast");
      if (toast) { toast.textContent = "✓ Saved for " + niceDate; toast.classList.add("show"); setTimeout(() => toast.classList.remove("show"), 2500); }
    });
  }

  document.querySelector("#cal-prev").addEventListener("click", () => { view.setMonth(view.getMonth() - 1); renderGrid(); });
  document.querySelector("#cal-next").addEventListener("click", () => { view.setMonth(view.getMonth() + 1); renderGrid(); });

  renderRolesBar();
  renderRoster();
  renderGrid();
  renderPanel();
}

/* ============================= EVENTS (admin) ============================= */
function initEventsAdmin() {
  requireLogin();
  const monthLabel = document.querySelector("#events-cal-month-label");
  const grid = document.querySelector("#events-cal-grid");
  const panel = document.querySelector("#events-panel");
  let view = new Date(); view.setDate(1);
  let selected = null;

  function renderGrid() {
    const events = loadJSON("sabc_events", {});
    monthLabel.textContent = view.toLocaleDateString(undefined, { month: "long", year: "numeric" });
    const firstDow = view.getDay();
    const daysIn = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
    let html = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map(d => `<div class="cal-dow">${d}</div>`).join("");
    for (let i = 0; i < firstDow; i++) html += `<div class="cal-day empty"></div>`;
    for (let day = 1; day <= daysIn; day++) {
      const d = new Date(view.getFullYear(), view.getMonth(), day);
      const iso = isoDate(d);
      const count = (events[iso] || []).length;
      html += `<div class="cal-day clickable${count ? " has-data" : ""}${selected === iso ? " selected" : ""}" data-date="${iso}">
        ${day}${count ? `<div style="font-size:10px;color:var(--blue);font-weight:800">${count} event${count > 1 ? "s" : ""}</div>` : ""}
      </div>`;
    }
    grid.innerHTML = html;
    grid.querySelectorAll("[data-date]").forEach(el => el.addEventListener("click", () => {
      selected = el.dataset.date; renderGrid(); renderPanel();
    }));
  }

  function renderPanel() {
    if (!selected) { panel.innerHTML = "<p class='field-hint'>Click a day above to add or edit events for that date.</p>"; return; }
    const events = loadJSON("sabc_events", {});
    const dayEvents = events[selected] || [];
    const niceDate = new Date(selected + "T00:00:00").toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
    let html = `<h3>${niceDate}</h3><div id="events-list">`;
    dayEvents.forEach(ev => {
      html += `
        <div class="role-row" data-event-id="${ev.id}" style="grid-template-columns:1fr auto">
          <div>
            <label>Event Title</label>
            <input type="text" data-ev="title" value="${ev.title || ""}" placeholder="e.g. Youth Group Night">
            <label style="margin-top:8px">Time</label>
            <input type="text" data-ev="time" value="${ev.time || ""}" placeholder="e.g. 6:30 PM">
            <label style="margin-top:8px">Description</label>
            <input type="text" data-ev="description" value="${ev.description || ""}" placeholder="Short description">
            <label style="margin-top:8px">Poster / Flyer <span style="font-weight:400;color:var(--muted)">(optional — image or PDF)</span></label>
            ${ev.file ? `<p class="field-hint">📎 ${ev.fileName || "Attached file"} — <button type="button" class="text-btn" data-remove-file="${ev.id}">remove</button></p>` : `<input type="file" accept="image/*,application/pdf" data-event-file="${ev.id}">`}
          </div>
          <button type="button" class="text-btn" data-remove-event="${ev.id}" style="color:#a62929;align-self:start">Remove</button>
        </div>`;
    });
    html += `</div>
      <button class="button button-light" id="add-event" type="button">+ Add Another Event This Day</button>
      <div class="edit-actions"><span></span><button class="button" id="save-events" type="button">Apply Changes</button></div>`;
    panel.innerHTML = html;
    cmsApplyViewOnlyLock(panel);

    panel.querySelector("#add-event").addEventListener("click", () => {
      const events = loadJSON("sabc_events", {});
      if (!events[selected]) events[selected] = [];
      events[selected].push({ id: uid(), title: "", time: "", description: "" });
      saveJSON("sabc_events", events);
      renderGrid(); renderPanel();
    });
    panel.querySelectorAll("[data-remove-event]").forEach(btn => btn.addEventListener("click", () => {
      const events = loadJSON("sabc_events", {});
      events[selected] = (events[selected] || []).filter(e => e.id !== btn.dataset.removeEvent);
      if (!events[selected].length) delete events[selected];
      saveJSON("sabc_events", events);
      renderGrid(); renderPanel();
    }));
    panel.querySelectorAll("[data-event-file]").forEach(input => input.addEventListener("change", () => {
      const file = input.files[0];
      if (!file) return;
      if (file.size > 8 * 1024 * 1024) { alert("That file's a bit large — try one under 8MB."); return; }
      const reader = new FileReader();
      reader.onload = () => {
        const events = loadJSON("sabc_events", {});
        const ev = (events[selected] || []).find(e => e.id === input.dataset.eventFile);
        if (ev) { ev.file = reader.result; ev.fileName = file.name; saveJSON("sabc_events", events); renderPanel(); }
      };
      reader.readAsDataURL(file);
    }));
    panel.querySelectorAll("[data-remove-file]").forEach(btn => btn.addEventListener("click", () => {
      const events = loadJSON("sabc_events", {});
      const ev = (events[selected] || []).find(e => e.id === btn.dataset.removeFile);
      if (ev) { delete ev.file; delete ev.fileName; saveJSON("sabc_events", events); renderPanel(); }
    }));
    const saveBtn = panel.querySelector("#save-events");
    if (saveBtn) saveBtn.addEventListener("click", () => {
      const events = loadJSON("sabc_events", {});
      const before = events[selected] || [];
      const rows = panel.querySelectorAll("[data-event-id]");
      const updated = [...rows].map(row => {
        const existing = before.find(e => e.id === row.dataset.eventId) || {};
        return {
          id: row.dataset.eventId,
          title: row.querySelector('[data-ev="title"]').value,
          time: row.querySelector('[data-ev="time"]').value,
          description: row.querySelector('[data-ev="description"]').value,
          file: existing.file,
          fileName: existing.fileName
        };
      });
      if (updated.length) events[selected] = updated; else delete events[selected];
      saveJSON("sabc_events", events);
      cmsLogRawChange("Events — " + niceDate, "sabc_events", selected, before, updated);
      renderGrid();
      const toast = document.querySelector("#events-toast");
      if (toast) { toast.textContent = "✓ Saved for " + niceDate; toast.classList.add("show"); setTimeout(() => toast.classList.remove("show"), 2500); }
    });
  }

  document.querySelector("#events-cal-prev").addEventListener("click", () => { view.setMonth(view.getMonth() - 1); renderGrid(); });
  document.querySelector("#events-cal-next").addEventListener("click", () => { view.setMonth(view.getMonth() + 1); renderGrid(); });

  renderGrid();
  renderPanel();
}

/* ====================== EVENTS (public rendering) ====================== */
function renderUpcomingEvents(targetSelector, max) {
  const el = document.querySelector(targetSelector);
  if (!el) return;
  const events = loadJSON("sabc_events", {});
  const now = new Date();
  const today = isoDate(now);
  // Public view only shows through the end of NEXT month — "this month and
  // next month, always" — so it doesn't fill up with things a year out.
  // Nothing is ever deleted from the admin's actual data; this only limits
  // what's DISPLAYED here.
  const windowEnd = new Date(now.getFullYear(), now.getMonth() + 2, 0); // last day of next month
  const windowEndIso = isoDate(windowEnd);
  const flat = [];
  Object.keys(events).sort().forEach(dateKey => {
    if (dateKey >= today && dateKey <= windowEndIso) events[dateKey].forEach(ev => flat.push({ ...ev, date: dateKey }));
  });
  if (!flat.length) {
    el.innerHTML = `<p class="placeholder-lines center">No upcoming events posted yet. Add some from the admin Events calendar.</p>`;
    return;
  }
  const shown = max ? flat.slice(0, max) : flat;
  let lastMonth = "";
  let html = "";
  shown.forEach(ev => {
    const d = new Date(ev.date + "T00:00:00");
    const month = d.toLocaleDateString(undefined, { month: "long", year: "numeric" });
    if (el.dataset.grouped === "true" && month !== lastMonth) {
      html += `<div class="month-heading"><h2>${month}</h2></div>`;
      lastMonth = month;
    }
    const badge = `${d.toLocaleDateString(undefined, { month: "short" }).toUpperCase()}<br><b>${d.getDate()}</b>`;
    const posterLink = ev.file ? `<a class="text-link" href="${ev.file}" target="_blank" rel="noopener" download="${ev.fileName || "event-flyer"}">📎 View/Download Flyer</a>` : "";
    if (el.dataset.grouped === "true") {
      html += `<article class="event-row"><span class="date-badge">${badge}</span><div><h3>${ev.title || "Untitled Event"}</h3><p>${ev.time ? `<strong>${ev.time}</strong> · ` : ""}${ev.description || ""}</p>${posterLink}</div></article>`;
    } else {
      html += `<article class="card"><span class="date-badge">${badge}</span><div><h3>${ev.title || "Untitled Event"}</h3><p>${ev.time ? ev.time + " · " : ""}${ev.description || ""}</p>${posterLink}</div></article>`;
    }
  });
  el.innerHTML = html;
}
function initWhoswhoAdmin() {
  requireLogin();
  const root = document.querySelector("#whoswho-admin-root");

  function personCardHtml(p) {
    return `<div class="person-card">
      <div class="person-photo">${p.photo ? `<img src="${p.photo}" style="display:block;width:100%;height:100%;object-fit:cover;object-position:50% ${p.photo_pos ?? 50}%">` : "PHOTO"}</div>
      <h3>${p.name || "(no name yet)"}</h3>
      <p class="person-role">${p.role || ""}</p>
      <p class="person-contact">${p.phone ? "☎ " + p.phone : ""}${p.phone && p.email ? "<br>" : ""}${p.email ? "✉ " + p.email : ""}</p>
    </div>`;
  }

  function refreshPreview() {
    const previewEl = document.querySelector("#whoswho-preview");
    if (!previewEl) return;
    const rows = root.querySelectorAll(".person-edit-card");
    const people = [...rows].map(row => ({
      name: row.querySelector('[data-field="name"]').value,
      role: row.querySelector('[data-field="role"]').value,
      phone: row.querySelector('[data-field="phone"]').value,
      email: row.querySelector('[data-field="email"]').value,
      photo: row.querySelector("[data-photo-for]").dataset.value || row.querySelector("[data-photo-for]").previousElementSibling.querySelector("img")?.src || null,
      photo_pos: row.querySelector("[data-pos-for]").value
    })).filter(p => p.name || p.photo);
    previewEl.innerHTML = people.length
      ? `<div class="person-grid">${people.map(personCardHtml).join("")}</div>`
      : `<p class="field-hint">Add a name or photo on the left to see it appear here.</p>`;
  }

  function render() {
    const people = loadJSON("sabc_whoswho", []);
    let html = `<div class="manage-list" id="people-list">`;
    people.forEach(p => {
      html += `
        <div class="person-edit-card" data-id="${p.id}">
          <div class="person-edit-top">
            <div class="photo-col">
              <label class="image-upload-slot" style="height:90px" for="photo_${p.id}">${p.photo ? `<img src="${p.photo}" style="object-position:50% ${p.photo_pos ?? 50}%">` : "Photo"}</label>
              <input type="file" accept="image/*" id="photo_${p.id}" data-photo-for="${p.id}" style="display:none">
              <input type="range" min="0" max="100" data-pos-for="${p.id}" value="${p.photo_pos ?? 50}" title="Focus point (top/bottom)" style="width:100%;margin-top:4px">
              ${p.photo ? `<button type="button" class="text-btn" data-clear-photo="${p.id}" data-allow-view-only style="font-size:12px;margin-top:2px">Remove photo</button>` : ""}
            </div>
            <div class="fields-col">
              <input type="text" data-field="name" placeholder="Name" value="${p.name || ""}">
              <input type="text" data-field="role" placeholder="Role (e.g. Deacon, Worship Leader)" value="${p.role || ""}">
              <input type="text" data-field="phone" placeholder="Phone" value="${p.phone || ""}">
              <input type="text" data-field="email" placeholder="Email" value="${p.email || ""}">
            </div>
          </div>
          <button type="button" class="button button-light" data-remove="${p.id}" style="margin-top:10px">Remove This Person</button>
        </div>`;
    });
    html += `</div>
      <button class="button button-light" id="add-person" type="button">+ Add Person</button>
      <div class="edit-actions"><span></span><button class="button" id="save-people" type="button" data-allow-view-only>Apply Changes</button></div>
      <p id="whoswho-toast" class="toast"></p>`;

    root.innerHTML = `
      <div class="edit-split">
        <div class="edit-col">${html}</div>
        <div class="preview-col"><h3>Live Preview</h3><div class="preview-frame" id="whoswho-preview"></div></div>
      </div>`;
    cmsApplyViewOnlyLock(root);
    refreshPreview();

    root.querySelectorAll('[data-field], [data-pos-for]').forEach(el => el.addEventListener("input", refreshPreview));

    root.querySelectorAll("[data-clear-photo]").forEach(btn => btn.addEventListener("click", () => {
      const people = loadJSON("sabc_whoswho", []);
      const person = people.find(p => p.id === btn.dataset.clearPhoto);
      if (person) { person.photo = null; saveJSON("sabc_whoswho", people); }
      render();
    }));

    root.querySelectorAll("[data-remove]").forEach(btn => btn.addEventListener("click", () => {
      const people = loadJSON("sabc_whoswho", []).filter(p => p.id !== btn.dataset.remove);
      saveJSON("sabc_whoswho", people);
      render();
    }));
    root.querySelectorAll("[data-photo-for]").forEach(input => input.addEventListener("change", () => {
      const file = input.files[0]; if (!file) return;
      compressImage(file, 500, 0.75).then(dataUrl => {
        const posRange = root.querySelector(`[data-pos-for="${input.dataset.photoFor}"]`);
        input.previousElementSibling.innerHTML = `<img src="${dataUrl}" style="object-position:50% ${posRange ? posRange.value : 50}%">`;
        input.dataset.value = dataUrl;
        refreshPreview();
      }).catch(err => alert("Couldn't process that photo: " + err.message));
    }));
    root.querySelectorAll("[data-pos-for]").forEach(range => range.addEventListener("input", () => {
      const img = root.querySelector(`#photo_${range.dataset.posFor}`).previousElementSibling.querySelector("img");
      if (img) img.style.objectPosition = `50% ${range.value}%`;

/* Turns a raw (non-CMS-schema) snapshot into something readable for the
   before/after preview — Who's Who, Admin Users, Calendar, and Events all
   store their data differently, so each gets its own small renderer. */
function renderRawSnapshot(revertKey, snapshot) {
  if (!snapshot) return "<p class='field-hint'>(empty)</p>";
  if (revertKey === "sabc_whoswho" && Array.isArray(snapshot)) {
    if (!snapshot.length) return "<p class='field-hint'>No one in the directory.</p>";
    return "<ul>" + snapshot.map(p => `<li><b>${p.name || "(no name)"}</b> — ${p.role || ""}${p.phone ? " · " + p.phone : ""}${p.email ? " · " + p.email : ""}</li>`).join("") + "</ul>";
  }
  if (revertKey === "sabc_admin_users" && Array.isArray(snapshot)) {
    if (!snapshot.length) return "<p class='field-hint'>No admins listed.</p>";
    return "<ul>" + snapshot.map(u => `<li><b>${u.name || u.email}</b> — ${u.access}</li>`).join("") + "</ul>";
  }
  if (revertKey === "sabc_schedule" && typeof snapshot === "object") {
    const roles = Object.keys(snapshot);
    if (!roles.length) return "<p class='field-hint'>No roles set for this day.</p>";
    return "<ul>" + roles.map(r => `<li><b>${r}</b>: ${snapshot[r].name || "(nobody yet)"} — ${snapshot[r].status === "yes" ? "✓ confirmed" : snapshot[r].status === "no" ? "✗ can't make it" : "(unconfirmed)"}</li>`).join("") + "</ul>";
  }
  if (revertKey === "sabc_events" && Array.isArray(snapshot)) {
    if (!snapshot.length) return "<p class='field-hint'>No events that day.</p>";
    return "<ul>" + snapshot.map(e => `<li><b>${e.title || "Untitled"}</b>${e.time ? " — " + e.time : ""}</li>`).join("") + "</ul>";
  }
  return `<pre style="white-space:pre-wrap;font-size:12px">${JSON.stringify(snapshot, null, 2)}</pre>`;
}

/* Rebuilds a full-page snapshot for the CMS-schema pages (Home, About,
   etc.) so previewTemplate() — the same function that powers the live
   editor preview — can render "what it looked like" for a log entry too.
   Fields this entry didn't touch fall back to the current live value. */
function buildPreviewSnapshot(pageKey, changes, useAfter) {
  const snap = cmsGetPage(pageKey);
  changes.forEach(c => {
    if (c.isRaw || !c.revertable) return;
    snap[c.field] = useAfter ? c.rawNew : c.rawOld;
  });
  return snap;
}

function initLog() {
  requireLogin();
  const root = document.querySelector("#log-root");
  const log = loadJSON("sabc_audit_log", []);

  if (!log.length) {
    root.innerHTML = "<p class='field-hint'>No changes logged yet. Every time someone applies changes in the admin area, it'll show up here.</p>";
  } else {
    root.innerHTML = log.map((entry, idx) => {
      const isRaw = entry.changes[0] && entry.changes[0].isRaw;
      const canRevert = entry.changes.some(c => c.revertable);
      return `
      <div class="log-entry">
        <time>${new Date(entry.ts).toLocaleString()}</time>
        <span class="log-page">${entry.page}</span>
        ${entry.changes.map(c => isRaw ? "" : `<p class="log-change"><b>${c.field}</b>: "${c.old}" → "${c.new}"</p>`).join("")}
        <div class="log-actions">
          <button type="button" class="text-btn" data-toggle-preview="${idx}" data-allow-view-only>👁 Preview before/after</button>
          ${canRevert ? `<button type="button" class="text-btn" data-revert="${idx}" style="color:#a62929">↩ Revert to before</button>` : ""}
        </div>
        <div class="log-preview" id="preview-${idx}" style="display:none"></div>
      </div>`;
    }).join("");

    root.querySelectorAll("[data-toggle-preview]").forEach(btn => btn.addEventListener("click", () => {
      const idx = btn.dataset.togglePreview;
      const entry = log[idx];
      const box = document.querySelector(`#preview-${idx}`);
      if (box.style.display === "none") {
        const isRaw = entry.changes[0] && entry.changes[0].isRaw;
        let beforeHtml, afterHtml;
        if (isRaw) {
          const c = entry.changes[0];
          beforeHtml = renderRawSnapshot(c.revertKey, c.rawOld);
          afterHtml = renderRawSnapshot(c.revertKey, c.rawNew);
        } else if (typeof previewTemplate === "function" && CMS_SCHEMA[entry.page]) {
          beforeHtml = previewTemplate(entry.page, buildPreviewSnapshot(entry.page, entry.changes, false));
          afterHtml = previewTemplate(entry.page, buildPreviewSnapshot(entry.page, entry.changes, true));
        } else {
          beforeHtml = afterHtml = "<p class='field-hint'>Preview not available for this entry.</p>";
        }
        box.innerHTML = `<div class="preview-before-after">
          <div><h4>Before</h4><div class="preview-frame">${beforeHtml}</div></div>
          <div><h4>After</h4><div class="preview-frame">${afterHtml}</div></div>
        </div>`;
        box.style.display = "block";
        btn.textContent = "🙈 Hide preview";
      } else {
        box.style.display = "none";
        btn.textContent = "👁 Preview before/after";
      }
    }));

    root.querySelectorAll("[data-revert]").forEach(btn => btn.addEventListener("click", async () => {
      const idx = btn.dataset.revert;
      const entry = log[idx];
      if (!confirm("Revert this change? This restores the previous version (text/lists only — photos aren't auto-reverted, re-upload if one was part of this change).")) return;
      const isRaw = entry.changes[0] && entry.changes[0].isRaw;
      const result = isRaw ? await cmsRevertRawEntry(entry) : await cmsRevertLogEntry(entry);
      if (result.ok) {
        cmsLogChange(entry.page + " (reverted)", [{ field: "Revert", old: "(the change above)", new: "(restored to before)" }]);
        alert("Reverted. The live page will show this the next time it loads.");
        initLog();
      } else {
        alert("Couldn't revert this one — nothing revertable was recorded for it (usually means it was a photo-only change).");
      }
    }));
    if (!cmsCanEdit()) root.querySelectorAll("[data-revert]").forEach(b => b.disabled = true);
  }

  document.querySelector("#download-log").addEventListener("click", () => {
    const text = log.map(e => `${e.ts} — ${e.page}\n` + e.changes.map(c => `  ${c.field}: "${c.old}" → "${c.new}"`).join("\n")).join("\n\n");
    const blob = new Blob([text || "No changes logged yet."], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "sabc-change-log.txt";
    a.click();
  });
}

function extractYoutubeId(raw) {
  if (!raw) return "";
  const match = String(raw).match(/(?:v=|youtu\.be\/|embed\/)?([a-zA-Z0-9_-]{11})(?:[?&]|$)/);
  return match ? match[1] : raw;
}

function initHeroRotation() {
  const photos = loadJSON("sabc_hero_photos", []);
  if (!photos.length) return; // none set — keep the default light gradient background
  const bgA = document.querySelector("#hero-bg-a");
  const bgB = document.querySelector("#hero-bg-b");
  const overlay = document.querySelector(".hero-overlay");
  const inner = document.querySelector(".hero-inner");
  overlay.classList.add("on");
  if (inner) inner.classList.add("on-photo");

  function setBg(el, p) {
    const photo = typeof p === "string" ? p : p.photo;
    const pos = typeof p === "string" ? 50 : (p.pos ?? 50);
    el.style.backgroundImage = `url(${photo})`;
    el.style.backgroundPosition = `50% ${pos}%`;
  }

  let idx = 0, useA = true;
  setBg(bgA, photos[0]);
  bgA.classList.add("active");
  if (photos.length < 2) return; // only one photo — nothing to rotate to
  setInterval(() => {
    idx = (idx + 1) % photos.length;
    const nextEl = useA ? bgB : bgA;
    const curEl = useA ? bgA : bgB;
    setBg(nextEl, photos[idx]);
    nextEl.classList.add("active");
    curEl.classList.remove("active");
    useA = !useA;
  }, 6000);
}
