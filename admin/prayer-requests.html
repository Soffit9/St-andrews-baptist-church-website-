0}cite{color:var(--muted);font-style:normal}.video-placeholder,.image-placeholder,.map-placeholder{display:grid;place-items:center;background:linear-gradient(135deg,#dcecfd,#c3ddf6);border:1px solid #9dc3ea;color:var(--blue);font-weight:700;min-height:180px;overflow:hidden}.video-placeholder{font-size:42px}.video-placeholder.featured{min-height:420px;max-width:850px;margin:auto}.contact-strip{display:grid;grid-template-columns:1.5fr 1fr auto;gap:30px;align-items:center}.contact-mini{display:flex;flex-direction:column;color:var(--muted)}.footer{background:#0d2e57;color:#fff;padding:32px 0}.footer-grid{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.footer a{color:#dcecff;margin-right:18px;display:inline-block}
.footer a:last-child{margin-right:0}.page-hero{background:var(--sky);padding:65px 0}.page-hero h1{font-size:clamp(38px,5vw,58px)}.page-hero p:not(.eyebrow){color:var(--muted);font-size:18px}.image-placeholder.large{height:300px;margin-bottom:40px;overflow:hidden}.placeholder-lines{color:var(--muted);max-width:760px}.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px;margin-top:35px}.info-grid article{box-shadow:none}.archive-title{margin-top:60px}.archive-list{display:grid;gap:10px}.archive-list button{background:#fff;border:1px solid var(--line);padding:16px 20px;text-align:left;font-size:17px;font-weight:800;color:var(--navy);border-radius:8px;cursor:pointer}.archive-list span{float:right}.sermon-meta{text-align:center}.event-row{display:flex;gap:20px;align-items:center;margin-bottom:14px}.month-heading{margin:35px 0 12px}.month-heading h2{margin:0}.form-card{max-width:720px;margin:auto}.form-card label,.login-card label{display:block;font-weight:800;margin-bottom:18px}.form-card label span{color:var(--muted);font-weight:400}.form-card input,.form-card textarea,.login-card input{width:100%;margin-top:7px;padding:12px;border:1px solid #b9c5d3;border-radius:7px;font:inherit}.privacy-note,.small{font-size:13px;color:var(--muted)}.success{color:#19734a;font-weight:700}.error{color:#a62929}.map-placeholder{min-height:220px;margin-top:20px}.check-list{padding-left:22px}.check-list li{margin:10px 0}.admin-page{background:#f3f6fa}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:38px;width:min(420px,100%);text-align:center}.login-card .logo-placeholder{margin:auto}.login-card h1{color:var(--navy);font-family:Georgia,serif}.admin-layout{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:#0d2e57;color:#fff;padding:25px 16px}.sidebar h2{font-family:Georgia,serif;padding:0 12px 20px;border-bottom:1px solid rgba(255,255,255,.2)}.sidebar nav{display:grid;gap:4px}.sidebar a{padding:11px 12px;border-radius:6px;color:#eaf3ff}.sidebar a:hover,.sidebar a.active{background:#174879}.admin-main{padding:38px}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:20px}.admin-top h1{margin:0;color:var(--navy)}.notice{background:#fff8df;border:1px solid #e7d58a;padding:12px 15px;border-radius:8px}

.file-warning a{color:#7a1f1f;text-decoration:underline}.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-top:25px}.quick-grid button{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px;text-align:left;cursor:pointer;min-height:140px}.quick-grid button:hover{border-color:#8aa9c7;box-shadow:var(--shadow)}.quick-grid b{display:block;font-size:28px;color:var(--blue);margin-bottom:8px}.quick-grid strong,.quick-grid span{display:block}.quick-grid span{font-size:13px;color:var(--muted);margin-top:5px}

.radio-row input{width:auto;margin:0}
.filter-warning{background:#fdeaea;border:1px solid #e6a9a9;color:#8a2626;padding:10px 14px;border-radius:8px;font-size:13px;margin-top:10px;display:none}
.verse-nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.verse-nav button{background:#fff;border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer;font-weight:700;color:var(--blue);transition:box-shadow .15s,transform .15s}
.verse-nav button:hover:not(:disabled){box-shadow:var(--shadow);transform:translateY(-1px)}
.verse-nav button:disabled{opacity:.4;cursor:default}

/* ---------- general polish ---------- */
a,button{transition:box-shadow .15s ease,transform .15s ease,filter .15s ease,background .15s ease}
.card:hover,.event-row:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.button:active{transform:translateY(1px)}
.brand strong{position:relative}
.footer a:hover{text-decoration:underline}

/* Hover "wiggle/lift" used everywhere something is clickable */
.nav a:hover,.info-grid article:hover,.person-card:hover,.archive-list button:hover,
.manage-row:hover,.log-entry:hover,.image-upload-slot:hover,.roster-chip:hover,
.quick-grid button:hover,.check-list li:hover,.text-link:hover,.button-light:hover{
  box-shadow:var(--shadow);transform:translateY(-2px)
}
.person-card,.info-grid article,.archive-list button,.manage-row,.log-entry,.roster-chip,.check-list li{transition:box-shadow .15s ease,transform .15s ease}
.check-list li{list-style:none;margin-left:-22px;padding:4px 8px 4px 26px;border-radius:6px;position:relative}
.check-list li::before{content:"✓";position:absolute;left:4px;color:var(--blue);font-weight:800}

/* ---------- Verse "find a day" jump control ---------- */
.verse-jump{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.verse-jump input[type=date]{padding:5px 8px;border:1px solid #b9c5d3;border-radius:6px;font:inherit}
@media(max-width:520px){.verse-jump label{display:none}.verse-jump{gap:6px}.verse-nav button{padding:6px 8px;font-size:13px}}

/* ---------- Dark mode ---------- */
.theme-toggle{background:#fff;border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-weight:800;cursor:pointer;color:var(--navy);font-size:13px}
[data-theme="dark"]{--navy:#e7edf6;--blue:#5da3f0;--sky:#16222f;--ink:#e9edf2;--muted:#a3aebb;--line:#2b3646;--paper:#0f1620;--soft:#161f2b;--shadow:0 8px 28px rgba(0,0,0,.35);--shadow-lg:0 16px 40px rgba(0,0,0,.45)}
[data-theme="dark"] .site-header{background:#0f1620}
[data-theme="dark"] .card,[data-theme="dark"] .event-row,[data-theme="dark"] .info-grid article,[data-theme="dark"] .service-card,[data-theme="dark"] .roster-chip,
[data-theme="dark"] .verse-box,[data-theme="dark"] .video-box,[data-theme="dark"] .form-card,
[data-theme="dark"] .person-card,[data-theme="dark"] .login-card,[data-theme="dark"] .manage-row,
[data-theme="dark"] .log-entry{background:#141d29}
[data-theme="dark"] .button-light{background:#141d29}
[data-theme="dark"] .logo-placeholder{background:#1b2531;border-color:#2b3646;color:#a3aebb}
[data-theme="dark"] .theme-toggle{background:#141d29;color:#e7edf6;border-color:#2b3646}
[data-theme="dark"] .hero{background:linear-gradient(135deg,#16222f,#0f1620)}
[data-theme="dark"] .archive-list button{background:#141d29}
[data-theme="dark"] input,[data-theme="dark"] textarea,[data-theme="dark"] select{background:#1b2531;color:#e9edf2;border-color:#2b3646}
[data-theme="dark"] .menu-toggle{color:#e9edf2}
[data-theme="dark"] .nav{background:#0f1620;border-color:#2b3646}
[data-theme="dark"] .nav a{color:#e9edf2}

/* ---------- Admin: page picker / dashboard ---------- */
.dash-topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.toast{max-width:1120px;margin:14px auto 0;background:#e7f7ee;border:1px solid #a9dfc0;color:#1a6b3d;padding:12px 18px;border-radius:9px;font-weight:700;display:none}
.toast.show{display:block}
.quick-grid button{display:flex;flex-direction:column;gap:2px}

/* ---------- Admin: edit form ---------- */
.edit-shell{max-width:760px;margin:0 auto}
.edit-field{margin-bottom:26px}
.edit-field label{display:block;font-weight:800;color:var(--navy);margin-bottom:8px}
.edit-field input[type=text],.edit-field textarea{width:100%;padding:12px;border:1px solid #b9c5d3;border-radius:8px;font:inherit;background:#fff}
.edit-field textarea{resize:vertical}
.field-hint{margin:-4px 0 10px;color:var(--muted);font-size:13px}
.image-upload-slot{display:grid;place-items:center;height:180px;border:2px dashed #9dc3ea;border-radius:10px;background:linear-gradient(135deg,#dcecfd,#c3ddf6);color:var(--blue);font-weight:700;cursor:pointer;overflow:hidden}
.image-upload-slot img{width:100%;height:100%;object-fit:cover}
.size-field{margin-top:10px}
.size-field input[type=range]{width:100%}
.size-field .size-readout{font-size:12px;color:var(--muted);font-weight:400}
.edit-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.edit-back{display:inline-block;margin-bottom:22px;color:var(--blue);font-weight:800}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(10,25,45,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-overlay.open{display:flex}
.modal-box{background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);padding:30px;max-width:420px;width:100%;text-align:center}
.modal-box h3{margin:0 0 10px;color:var(--navy);font-family:Georgia,serif}
.modal-actions{display:flex;justify-content:center;gap:12px;margin-top:20px}

/* ---------- Two-step login ---------- */
.hidden-step{display:none}
.code-box{background:var(--sky);border:1px solid #b9d8f5;border-radius:9px;padding:14px;margin:16px 0;font-size:14px}
.code-box strong{display:block;font-size:26px;letter-spacing:4px;color:var(--navy);margin-top:4px}
#code-input{letter-spacing:6px;font-size:20px;text-align:center}
.text-btn{background:none;border:0;color:var(--blue);font-weight:800;cursor:pointer;padding:0;text-decoration:underline}

/* ---------- Edit page: split editor + live preview ---------- */
.edit-split{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.edit-col h3,.preview-col h3{color:var(--navy);font-family:Georgia,serif;margin-top:0}
.preview-col{position:sticky;top:90px;background:var(--soft);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.preview-frame{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px;box-shadow:var(--shadow)}
.preview-frame .eyebrow{font-size:10px}
.preview-frame h1,.preview-frame h2{font-size:22px;margin:8px 0}
.preview-frame p{font-size:14px}
@media(max-width:900px){.edit-split{grid-template-columns:1fr}.preview-col{position:static}}

/* ---------- Calendar (Sunday roles) ---------- */
.cal-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-topbar button{background:#fff;border:1px solid var(--line);border-radius:7px;padding:8px 14px;font-weight:800;color:var(--blue);cursor:pointer}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal-grid .cal-dow{font-size:11px;font-weight:800;color:var(--muted);padding:4px 0}
.cal-day{border:1px solid var(--line);border-radius:8px;min-height:56px;padding:6px 4px;font-size:13px;color:var(--muted);background:#fff}
.cal-day.empty{border:none;background:transparent}
.cal-day.clickable{cursor:pointer}
.cal-day.clickable:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.cal-day.sunday{background:var(--sky);border-color:#b9d8f5;color:var(--navy);font-weight:800}
.cal-day.has-data::after{content:"●";display:block;color:var(--blue);font-size:10px}
.cal-day.selected{outline:2px solid var(--blue)}
.role-panel{margin-top:26px;border:1px solid var(--line);border-radius:var(--radius);padding:22px;background:var(--soft)}
.role-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-bottom:12px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.role-row label{font-weight:800;color:var(--navy);font-size:14px;display:block;margin-bottom:4px}
.role-row input[type=text]{width:100%;padding:8px;border:1px solid #b9c5d3;border-radius:6px;font:inherit}
.role-row select{padding:8px;border:1px solid #b9c5d3;border-radius:6px;font:inherit;font-weight:700}
.roster-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.roster-chip{background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:13px;display:flex;align-items:center;gap:6px}
.roster-chip button{background:none;border:0;color:#a62929;cursor:pointer;font-weight:800}

/* ---------- Who's Who ---------- */
.person-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.person-card{border:1px solid var(--line);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow);overflow:hidden;text-align:center;padding-bottom:18px}
.person-photo{height:170px;background:linear-gradient(135deg,#dcecfd,#c3ddf6);display:grid;place-items:center;color:var(--blue);font-weight:700;overflow:hidden}
.person-photo img{display:block;width:100%;height:100%;object-fit:cover}
.person-card h3{margin:16px 0 2px;padding-top:2px;color:var(--navy);border-top:1px solid var(--line)}
.person-role{color:var(--blue);font-weight:700;font-size:13px;margin-bottom:8px}
.person-contact{font-size:13px;color:var(--muted)}
@media(max-width:850px){.person-grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.person-grid{grid-template-columns:1fr}}

/* ---------- Admin: people/roster management lists ---------- */
.manage-list{display:grid;gap:10px;margin:20px 0}
.manage-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.manage-row input,.manage-row select{padding:8px;border:1px solid #b9c5d3;border-radius:6px;font:inherit;width:100%}
.manage-row button{background:none;border:0;color:#a62929;font-weight:800;cursor:pointer}
@media(max-width:750px){.manage-row{grid-template-columns:1fr}}

/* ---------- Log page ---------- */
.log-entry{border:1px solid var(--line);border-radius:8px;background:#fff;padding:12px 16px;margin-bottom:10px}
.log-entry time{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.log-entry .log-page{font-weight:800;color:var(--navy)}
.log-change{font-size:13px;color:var(--muted);margin:2px 0}
.log-change b{color:var(--ink)}
.log-actions{display:flex;gap:16px;margin-top:10px}
.preview-before-after{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
.preview-before-after h4{margin:0 0 6px;color:var(--navy);font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.preview-before-after .preview-frame{padding:14px;font-size:13px}
.preview-before-after .preview-frame ul{margin:0;padding-left:18px}
@media(max-width:700px){.preview-before-after{grid-template-columns:1fr}}
@media(max-width:850px){.nav{display:none;position:absolute;top:78px;left:0;right:0;background:#fff;border-bottom:1px solid var(--line);padding:15px 4%;flex-direction:column}.nav.open{display:flex}.menu-toggle{display:block}.card-grid.three,.split,.contact-strip{grid-template-columns:1fr}.quick-grid{grid-template-columns:repeat(2,1fr)}.admin-layout{grid-template-columns:1fr}.sidebar{position:static}.admin-main{padding:24px}.admin-top{align-items:flex-start;flex-direction:column}.video-placeholder.featured{min-height:250px}}
@media(max-width:520px){.info-grid,.quick-grid{grid-template-columns:1fr}.hero{padding:65px 0}.brand{font-size:17px}.brand strong{font-size:17px}.section{padding:50px 0}.event-row{align-items:flex-start}}

/* ---------- Dark mode: decisive catch-all (guarantees every surface goes
   dark, instead of chasing one selector at a time — this is deliberately
   !important since it's the final safety net for the whole page) ---------- */
[data-theme="dark"] body{background:var(--paper) !important;color:var(--ink) !important}
[data-theme="dark"] .admin-page,[data-theme="dark"] .admin-main,[data-theme="dark"] .admin-layout,
[data-theme="dark"] .login-wrap{background:var(--paper) !important}
[data-theme="dark"] .card,[data-theme="dark"] .quick-grid button,[data-theme="dark"] .manage-row,
[data-theme="dark"] .person-card,[data-theme="dark"] .log-entry,[data-theme="dark"] .role-row,
[data-theme="dark"] .cal-day,[data-theme="dark"] .event-row,[data-theme="dark"] .info-grid article,
[data-theme="dark"] .service-card,[data-theme="dark"] .verse-box,[data-theme="dark"] .video-box,
[data-theme="dark"] .form-card,[data-theme="dark"] .login-card,[data-theme="dark"] .preview-frame,[data-theme="dark"] #preview-frame,
[data-theme="dark"] .modal-box,[data-theme="dark"] .code-box,[data-theme="dark"] .roster-chip,
[data-theme="dark"] .archive-list button,[data-theme="dark"] .image-upload-slot,
[data-theme="dark"] .person-edit-card{
  background:#141d29 !important;border-color:#2b3646 !important;color:#e9edf2 !important
}
[data-theme="dark"] .cal-day.sunday{background:#16222f !important}
[data-theme="dark"] .notice{background:#2a2716 !important;border-color:#5c5323 !important;color:#e9edf2 !important}

<script>
/* ---------------------------------------------------------------------
   Prototype CMS "content" layer.
   Everything a user edits in /admin/edit.html is stored in the browser's
   localStorage (key: sabc_content) and re-applied on top of the default
   text/images every time a public page loads. There's no server yet —
   this is here to prove out the editing experience before a real
   Raspberry Pi backend replaces it. Content is scoped by page + field id,
   and only the fields listed below are editable, on purpose, so nobody
   can accidentally break the page layout.
--------------------------------------------------------------------- */

/* ---------- Dark mode (works on every page, admin included; defaults to light) ---------- */
document.addEventListener("DOMContentLoaded", async () => {
  const THEME_KEY = "sabc_theme";
  const themeBtn = document.querySelector("#theme-toggle");
  const SUN_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
  const MOON_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  function applyTheme(theme) {
    if (theme === "dark") { document.documentElement.setAttribute("data-theme", "dark"); if (themeBtn) themeBtn.innerHTML = SUN_ICON; }
    else { document.documentElement.removeAttribute("data-theme"); if (themeBtn) themeBtn.innerHTML = MOON_ICON; }
  }
  applyTheme(localStorage.getItem(THEME_KEY) || "light");
  if (themeBtn) themeBtn.addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    localStorage.setItem(THEME_KEY, next);
    applyTheme(next);
  });

  // Load the REAL server-side login session before anything on the page
  // tries to check "is someone logged in, and as who" — admin.js and
  // features.js both wait for this event instead of their own
  // DOMContentLoaded, so they never run against stale/empty session data.
  await fetchSession();
  await fetchAllStoredData();
  document.dispatchEvent(new CustomEvent("sabc:session-ready"));

  // On mobile, the on-screen keyboard often covers whatever you just
  // tapped — scroll the focused field into clear view above it, on any
  // admin page. A short delay lets the keyboard actually finish opening
  // first; scrolling too early undercounts how much space the keyboard
  // will take.
  if (document.body.classList.contains("admin-page")) {
    document.addEventListener("focusin", e => {
      if (e.target.matches("input, textarea, select")) {
        setTimeout(() => e.target.scrollIntoView({ block: "center", behavior: "smooth" }), 300);
      }
    });
  }
});

/* ---------------- Real shared storage — Who's Who, Gallery, Events,
   Calendar, Sermon Archive, and page content all live on the server now,
   not per-browser. This pulls everything down ONCE per page load into an
   in-memory cache (window.__serverStore), so the rest of the existing
   code — all written against a synchronous loadJSON/saveJSON — doesn't
   need to be rewritten to be async everywhere it's used. saveJSON still
   writes to the cache immediately (so the page feels instant) and fires
   the real save to the server in the background. ---------------- */
window.__serverStore = {};
const STORE_KEYS = [
  "sabc_content", "sabc_roster", "sabc_schedule_roles", "sabc_schedule",
  "sabc_events", "sabc_whoswho", "sabc_sermon_archive", "sabc_gallery",
  "sabc_hero_photos", "sabc_audit_log"
];

async function fetchAllStoredData() {
  await Promise.all(STORE_KEYS.map(async key => {
    try {
      const res = await fetch(`/api/store/${key}`, { credentials: "same-origin" });
      window.__serverStore[key] = await res.json();
    } catch {
      window.__serverStore[key] = null; // backend unreachable — code below falls back to defaults
    }
  }));
}

/* ---------------- Admin identity & access level — REAL now, backed by
   the Flask server's session cookie instead of a client-side guess. ---------------- */
window.__adminSession = null; // populated once, at page load, by fetchSession() below

async function fetchSession() {
  try {
    const res = await fetch("/api/auth/session", { credentials: "same-origin" });
    window.__adminSession = await res.json();
  } catch {
    // Backend unreachable (e.g. testing a page straight off disk with no
    // server behind it) — treat as logged out rather than crash the page.
    window.__adminSession = { loggedIn: false };
  }
  return window.__adminSession;
}

async function cmsGetAdminUsers() {
  try {
    const res = await fetch("/api/admins", { credentials: "same-origin" });
    return await res.json();
  } catch {
    return [];
  }
}
function cmsGetCurrentAdmin() {
  const s = window.__adminSession;
  if (!s || !s.loggedIn) return null;
  return { name: s.name, email: s.email, access: s.access };
}
function cmsCanEdit() {
  const a = cmsGetCurrentAdmin();
  return !a || a.access !== "View Only"; // no identity picked yet -> don't lock anyone out
}
/* Locks text/select fields (and "add/remove" style buttons) inside a
   container for View Only admins. File inputs and range sliders are left
   alone on purpose — "every admin can at least view and upload photos". */
function cmsApplyViewOnlyLock(container) {
  if (cmsCanEdit()) return;
  container.querySelectorAll('input[type="text"], input[type="email"], textarea').forEach(el => el.readOnly = true);
  container.querySelectorAll('select').forEach(el => el.disabled = true);
  container.querySelectorAll('button').forEach(el => {
    if (el.dataset.allowViewOnly === undefined) el.disabled = true;
  });
  const banner = document.createElement("p");
  banner.className = "notice";
  banner.style.background = "#fdeaea";
  banner.style.borderColor = "#e6a9a9";
  banner.textContent = "👁 You're logged in with View Only access — you can browse everything and upload/reposition photos, but text and list changes are locked. Ask a Full Admin or Can-Edit admin for changes.";
  container.prepend(banner);
}

const CMS_SCHEMA = {

    images: [

    ],

    fields: [
